<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>WellCooked 关卡布局编辑器</title>
<style>
  :root { --bg:#1b1d21; --panel:#25282e; --line:#3a3f47; --text:#e8eaed; --dim:#9aa0a6; --accent:#4c9aff; --warn:#ff6b6b; --ok:#3ecf8e; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); display:flex; height:100vh; overflow:hidden; }
  #left { flex:1; display:flex; flex-direction:column; min-width:0; }
  #right { width:360px; background:var(--panel); border-left:1px solid var(--line); display:flex; flex-direction:column; overflow:hidden; }
  #sideTop { flex:0 1 auto; min-height:0; overflow-y:auto; }
  header { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:15px; margin:0 12px 0 0; font-weight:600; }
  button, select, input { background:#2f343c; color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 10px; font:inherit; }
  button:hover { border-color:var(--accent); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #canvasWrap { flex:1; overflow:auto; padding:12px; display:flex; }
  canvas { margin:auto; image-rendering:pixelated; cursor:crosshair; box-shadow:0 0 0 1px #3a3f47, 0 8px 24px rgba(0,0,0,.45); }
  .sect { padding:12px 14px; border-bottom:1px solid var(--line); }
  .sect h2 { font-size:13px; margin:0 0 8px; color:var(--dim); font-weight:600; letter-spacing:.04em; }
  .palette { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .palette button { text-align:left; font-size:12px; padding:6px 8px; }
  .palette button.active { outline:2px solid var(--accent); }
  #list { flex:1 1 240px; min-height:200px; overflow:auto; font-size:12px; }
  .group { position:sticky; top:0; z-index:1; background:#20232a; color:#8b929b; font-size:11px; padding:4px 8px; border-bottom:1px solid #2f333a; letter-spacing:.04em; }
  .row { display:flex; gap:6px; align-items:center; padding:3px 6px; border-bottom:1px solid #2f333a; cursor:pointer; }
  .row:hover { background:#2c313a; }
  .row.sel { background:#2c3a4f; }
  .empty { padding:10px 8px; color:#8b929b; font-size:12px; }
  .sw { width:10px; height:10px; border-radius:2px; flex:0 0 auto; }
  .row span.n { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row span.c { color:var(--dim); }
  #status { padding:8px 14px; font-size:12px; border-top:1px solid var(--line); min-height:38px; }
  .err { color:var(--warn); }
  .good { color:var(--ok); }
  label.inline { font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<div id="left">
  <header>
    <h1>WellCooked 布局编辑器</h1>
    <select id="fileSel"></select>
    <button id="btnLoad">加载</button>
    <input id="fileName" value="layout_1.tsv" size="16">
    <button id="btnSave" class="primary">保存到仓库</button>
    <label class="inline"><input type="checkbox" id="eraseMode"> 橡皮</label>
    <label class="inline"><input type="checkbox" id="autoSave"> 实时保存</label>
    <button id="btnRotate">旋转选中 (R)</button>
    <button id="btnBuild" style="background:#2f6f4f;border-color:#2f6f4f;color:#fff">构建并部署</button>
    <button id="btnClear">清空</button>
  </header>
  <div id="canvasWrap"><canvas id="cv"></canvas></div>
  <div id="status">就绪</div>
</div>

<div id="right">
  <div id="sideTop">
  <div class="sect">
    <h2>笔刷</h2>
    <div class="palette" id="palette"></div>
  </div>
  <div class="sect">
    <h2>料箱原料（选中料箱后生效）</h2>
    <select id="ingSel" style="width:100%"></select>
  </div>
  <div class="sect" id="menuPanel">
    <h2>本关菜单（写进 layout 的 # menu: 行）</h2>
    <div id="menuList" style="font-size:12px"></div>
    <div style="margin-top:8px">
      <button id="btnMenuAuto">按料箱自动推荐</button>
      <button id="btnMenuAll">全选</button>
    </div>
  </div>
  <div class="sect">
    <h2>处理时间（游戏全局，重进关卡生效）</h2>
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">
      <span style="color:#9aa0a6;font-size:12px">煮/炸</span>
      <input id="cookTime" type="number" min="1" max="30" step="0.5" value="10" style="width:70px">
      <span style="color:#9aa0a6;font-size:12px">秒</span>
    </div>
    <div id="cookHint" style="color:#8b929b;font-size:11px;margin-bottom:6px">煮好 10s，20s 烧焦</div>
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:4px">
      <span style="color:#9aa0a6;font-size:12px">切菜阶段</span>
      <input id="chopStages" type="number" min="2" max="8" step="1" value="8" style="width:60px">
      <span style="color:#8b929b;font-size:11px">2–8</span>
    </div>
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
      <span style="color:#9aa0a6;font-size:12px">单人每阶段刀数</span>
      <input id="chopMult" type="number" min="1" max="10" step="1" value="5" style="width:60px">
      <span style="color:#8b929b;font-size:11px">1–10</span>
    </div>
    <div id="chopEstimate" style="color:#8b929b;font-size:11px;margin-bottom:6px">单人：35 刀 ≈ 7.0s；2P+：7 刀 ≈ 1.4s（0.2s/刀）</div>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="btnApplyProcessing">应用到游戏</button>
      <button id="btnResetProcessing">恢复默认</button>
    </div>
    <div id="procStatus" style="color:#8b929b;font-size:11px;margin-top:5px;white-space:pre-wrap">读取中…</div>
  </div>
  </div>
  <div class="sect" style="padding-bottom:6px">
    <h2>物体列表（点击行 = 定位并选中，右键行 / Delete 键 = 删除）</h2>
  </div>
  <div id="list"></div>
</div>

<script>
const X0 = -12, X1 = 30, Z0 = -18, Z1 = 6;      // 编辑范围（格）
const CS = 34;                                  // 每格像素
const CELL = 0.6;   // 实测：台面 1.2 米 = 2 格，最小公因数 0.6 米
// 真实可视地板（米）：x -6.6..17.4, z -10.2..3.0 → 换算成格
const FLOOR = { x0: -6.6 / CELL, x1: 17.4 / CELL, z0: -10.2 / CELL, z1: 3.0 / CELL };
const COLS = X1 - X0, ROWS = Z1 - Z0;

const KINDS = [
  { kind:"dispenser",   name:"料箱",   prefab:"Dispenser",       so:"Dispenser01SO",   color:"#d7a15a", w:2, h:2 },
  { kind:"chopping",    name:"砧板",   prefab:"ChoppingCounter", so:"ChoppingCounterSO", color:"#8fbf6a", w:2, h:2 },
  { kind:"cooker",      name:"灶台",   prefab:"Cooker",          so:"CookerSO",        color:"#e0705a", w:2, h:2 },
  { kind:"frying",      name:"炸台",   prefab:"FryingStation",   so:"FryingStationSO", color:"#e0a35a", w:2, h:2 },
  { kind:"plate_stack", name:"盘堆",   prefab:"CleanPlateStack", so:"CleanPlateStackSO", color:"#8fb4d7", w:2, h:2 },
  { kind:"serving",     name:"出菜口", prefab:"ServingStation",  so:"ServingStationSO", color:"#b58fd7", w:4, h:2 },
  { kind:"plate_return",name:"脏盘台", prefab:"PlateReturn",     so:"PlateReturnSO",   color:"#7a7f8a", w:2, h:2 },
  { kind:"washing",     name:"水槽(洗盘)", prefab:"Sink",          so:"SinkSO",          color:"#7fc7d7", w:4, h:2 },
  { kind:"counter",     name:"普通台面(墙)", prefab:"Counter",         so:"CounterSO",       color:"#6f6a5a", w:2, h:2 },
  { kind:"utensil",     name:"煮锅",   prefab:"Pot",             so:"PotSO",           color:"#c9c9c9", w:2, h:2 },
  { kind:"utensil",     name:"煎锅",   prefab:"FryPan",          so:"FryPanSO",        color:"#d8c07a", w:2, h:2 },
  { kind:"utensil",     name:"炸锅",   prefab:"FrierBasket",     so:"FrierBasketSO",   color:"#c98a3a", w:2, h:2 },
  { kind:"utensil",     name:"灭火器", prefab:"FireExtinguisher", so:"FireExtinguisherSO", color:"#e05a5a", w:2, h:2 },
  { kind:"spawn",       name:"厨师出生点", prefab:"",            so:"",                color:"#4c9aff", w:1, h:1 },
];
const INGREDIENTS = [
  { v:"TortillaSO",       n:"玉米饼" },
  { v:"RiceSO",           n:"米（要煮）" },
  { v:"BurritoChickenSO", n:"鸡肉（切+炸）" },
  { v:"BurritoMeatSO",    n:"牛肉（切+炸）" },
  { v:"MushroomSO",       n:"蘑菇（切）" },
  { v:"SushiFishSO",      n:"寿司鱼（切）" },
  { v:"SushiPrawnSO",     n:"寿司虾（切）" },
];

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
cv.width = COLS * CS; cv.height = ROWS * CS;

let objs = [];            // {kind,prefab,so,ing,x,z,note}
let brush = KINDS[0];
let selected = -1;

const px = (x) => (x - X0) * CS;
const py = (z) => (Z1 - 1 - z) * CS;   // z 向上
const cellAt = (ev) => {
  const r = cv.getBoundingClientRect();
  const col = Math.floor((ev.clientX - r.left) / CS);
  const row = Math.floor((ev.clientY - r.top) / CS);
  if (col < 0 || row < 0 || col >= COLS || row >= ROWS) return null;
  return { x: X0 + col, z: Z0 + (ROWS - 1 - row) };
};

// ---- 占位模型：前端与生成器 BuildWellCookedDemo.cs 必须逐格一致 ----
// 工位以锚点格 (x,z) 为中心，占据 w x h 格（中心对齐）：
//   x0 = x - w/2, x1 = x + w/2, z0 = z - h/2, z1 = z + h/2
// 生成器 FootprintOf() 用米、这里用格，0.6 米/格，2x2 / 4x2 的整数结果完全对应。
// 锚点不是左上角：2x2 台面放在 (7,0) 时占 (6,0)(7,0)(6,1)(7,1)，与游戏里一致。
function layoutBounds(list) {
  // 必须和生成器 ComputeRoomBounds() 一样：只跳过 spawn（utensil/plate_stack 也算），
  // 否则靠墙判断（yaw）会不同，同一个 sink 在两边会被算成不同朝向。
  const all = (list || objs).filter(o => o.kind !== "spawn");
  if (!all.length) return { minX:0, maxX:0, minZ:0, maxZ:0 };
  const xs = all.map(o => o.x), zs = all.map(o => o.z);
  return { minX:Math.min(...xs), maxX:Math.max(...xs), minZ:Math.min(...zs), maxZ:Math.max(...zs) };
}
function wallYaw(gx, gz, bb) {
  if (gz >= bb.maxZ) return 180;   // 北墙 -> 朝南（朝屋里）
  if (gz <= bb.minZ) return 0;     // 南墙 -> 朝北（朝屋里）
  if (gx <= bb.minX) return 90;    // 西墙 -> 朝东
  if (gx >= bb.maxX) return 270;   // 东墙 -> 朝西
  return 0;
}
// 出餐口的箭头必须朝屋外；映射与生成器 ServingYaw() 一字不差：
// 东 90 / 北 0 / 南 180 / 西 270，岛台朝东 90。
function servingYaw(gx, gz, bb) {
  if (gz >= bb.maxZ) return 0;
  if (gz <= bb.minZ) return 180;
  if (gx <= bb.minX) return 270;
  if (gx >= bb.maxX) return 90;
  return 90;
}
function yawOf(o, bb) {
  bb = bb || layoutBounds();
  if (o.kind === "serving") return servingYaw(o.x, o.z, bb);   // 出餐口永远由位置决定（dir 不生效）
  if (o.dir === undefined || o.dir === null || o.dir === "") return wallYaw(o.x, o.z, bb);
  return ((parseInt(o.dir, 10) % 360) + 360) % 360;
}
// 长轴跟着朝向走：0/180 => 长轴沿 x；90/270 => 长轴沿 z。
// 用和生成器 FootprintOf() 相同的区间（45..135 / 225..315），非 90 的整数倍也一致。
function dimsOf(o, bb) {
  const k = KINDS.find(k => k.prefab === o.prefab) || KINDS.find(k => k.kind === o.kind) || {};
  let w = k.w || 1, h = k.h || 1;
  const y = yawOf(o, bb);
  if ((y > 45 && y < 135) || (y > 225 && y < 315)) { const t = w; w = h; h = t; }
  return { w: w, h: h, yaw: y };
}
// 占地矩形（格坐标，中心对齐）
function boxOf(o, bb) {
  const d = dimsOf(o, bb);
  return { x0:o.x - d.w / 2, x1:o.x + d.w / 2,
           z0:o.z - d.h / 2, z1:o.z + d.h / 2,
           w:d.w, h:d.h, yaw:d.yaw };
}
function covers(o, x, z, bb) {
  const b = boxOf(o, bb);
  return x >= b.x0 && x < b.x1 && z >= b.z0 && z < b.z1;
}
function solidAt(o) { return o.kind !== "utensil" && o.kind !== "plate_stack" && o.kind !== "spawn"; }
function boxesOverlap(a, b) {
  return a.x0 < b.x1 && b.x0 < a.x1 && a.z0 < b.z1 && b.z0 < a.z1;
}
// 与生成器 PlaceFromLayout() 的检查范围一致：utensil / plate_stack 装在宿主上，不占地面。
function findOverlaps(list) {
  list = list || objs;
  const bb = layoutBounds(list);
  const solid = list.map((o, i) => ({ o, i })).filter(e => solidAt(e.o));
  const out = [];
  for (let a = 0; a < solid.length; a++) {
    for (let b = a + 1; b < solid.length; b++) {
      if (boxesOverlap(boxOf(solid[a].o, bb), boxOf(solid[b].o, bb))) out.push([solid[a].i, solid[b].i]);
    }
  }
  return out;
}
// 拖动连画时用：候选物体是否与已有落地工位冲突（单击放置不走这里，允许放下并标红）。
function conflictsWith(cand) {
  const list = objs.concat([cand]);
  const bb = layoutBounds(list);
  const cb = boxOf(cand, bb);
  return objs.some(o => solidAt(o) && boxesOverlap(cb, boxOf(o, bb)));
}
function kindName(o) {
  const k = KINDS.find(k => k.prefab === o.prefab) || KINDS.find(k => k.kind === o.kind) || {};
  return k.name || o.kind;
}
function zxy(o) { return "(" + o.x + "," + o.z + ")"; }
function overlapText(pair) {
  const a = objs[pair[0]], b = objs[pair[1]];
  return zxy(a) + " 的" + kindName(a) + "与 " + zxy(b) + " 的" + kindName(b) + " 占地重叠";
}
function draw() {
  ctx.clearRect(0,0,cv.width,cv.height);
  // 背景
  ctx.fillStyle = "#17191d"; ctx.fillRect(0,0,cv.width,cv.height);
  // 地板范围
  const fx = px(FLOOR.x0), fw = (FLOOR.x1-FLOOR.x0)*CS;
  const fz = py(FLOOR.z1), fh = (FLOOR.z1-FLOOR.z0)*CS;
  ctx.fillStyle = "rgba(76,154,255,.08)"; ctx.fillRect(fx, fz, fw, fh);
  ctx.strokeStyle = "rgba(76,154,255,.45)"; ctx.lineWidth = 2; ctx.strokeRect(fx, fz, fw, fh);
  // 网格
  ctx.strokeStyle = "#262a30"; ctx.lineWidth = 1;
  for (let i=0;i<=COLS;i++){ ctx.beginPath(); ctx.moveTo(i*CS,0); ctx.lineTo(i*CS,cv.height); ctx.stroke(); }
  for (let j=0;j<=ROWS;j++){ ctx.beginPath(); ctx.moveTo(0,j*CS); ctx.lineTo(cv.width,j*CS); ctx.stroke(); }
  // 坐标标注（每 5 格）
  ctx.fillStyle = "#5a616b"; ctx.font = "10px Consolas,monospace";
  for (let x=X0;x<X1;x+=5){ ctx.fillText(String(x), px(x)+2, 11); }
  for (let z=Z0;z<Z1;z+=5){ ctx.fillText(String(z), 2, py(z)+12); }
  // 物体（占位以锚点格为中心；与其它落地工位冲突的画红色边框）
  const bb = layoutBounds(objs);
  const bad = new Set();
  findOverlaps(objs).forEach(p => { bad.add(p[0]); bad.add(p[1]); });
  objs.forEach((o,i) => {
    const k = KINDS.find(k=>k.prefab===o.prefab) || KINDS.find(k=>k.kind===o.kind) || {color:"#888"};
    const b = boxOf(o, bb);
    const left = (b.x0 - X0) * CS, top = (Z1 - b.z1) * CS;
    const wPx = b.w * CS, hPx = b.h * CS;
    const isUt = (o.kind === "utensil");
    const inset = isUt ? Math.round(CS * 0.28) : 2;
    ctx.fillStyle = k.color;
    ctx.fillRect(left + inset, top + inset, wPx - inset * 2, hPx - inset * 2);
    if (isUt) {
      ctx.strokeStyle = "#1b1d21"; ctx.lineWidth = 1;
      ctx.strokeRect(left + inset, top + inset, wPx - inset * 2, hPx - inset * 2);
    }
    if (i === selected) {
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.strokeRect(left + 1, top + 1, wPx - 2, hPx - 2);
    }
    if (bad.has(i)) {   // 红色边框 = 与已有落地工位占地重叠（保存前就能看到）
      ctx.strokeStyle = "#ff3b30"; ctx.lineWidth = 3;
      ctx.strokeRect(left + 2, top + 2, wPx - 4, hPx - 4);
    }
    if (o.kind === "serving" || o.kind === "plate_return") {
      const yaw = b.yaw;
      const mx = left + wPx / 2, my = top + hPx / 2;
      const dx = yaw === 90 ? 1 : (yaw === 270 ? -1 : 0);
      const dy = yaw === 180 ? 1 : (yaw === 0 ? -1 : 0);
      ctx.fillStyle = "#12140f";
      ctx.beginPath();
      ctx.moveTo(mx + dx * CS * 0.30, my + dy * CS * 0.30);
      ctx.lineTo(mx - dx * CS * 0.12 + dy * CS * 0.20, my - dy * CS * 0.12 - dx * CS * 0.20);
      ctx.lineTo(mx - dx * CS * 0.12 - dy * CS * 0.20, my - dy * CS * 0.12 + dx * CS * 0.20);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "#12140f"; ctx.font = "9px Consolas,monospace";
    const tag = o.kind === "dispenser"
      ? (o.ing || "料箱").replace("SO", "")
      : (k.name || o.kind);
    ctx.fillText(tag.slice(0, 6), left + 3, top + hPx - 6);
  });
}

function renderPalette() {
  const p = document.getElementById("palette");
  p.innerHTML = "";
  KINDS.forEach(k => {
    const b = document.createElement("button");
    b.innerHTML = `<b>${k.name}</b><br><span style="color:#8b929b;font-size:11px">${k.kind}</span>`;
    b.style.borderLeft = "6px solid " + k.color;
    b.onclick = () => {
      brush = k;
      [...p.children].forEach(c=>c.classList.remove("active")); b.classList.add("active");
      if (selected >= 0 && objs[selected]) {
        const o = objs[selected];
        o.kind = k.kind; o.prefab = k.prefab; o.so = k.so;
        o.ing = (k.kind === "dispenser") ? document.getElementById("ingSel").value : "";
        draw(); renderList(); validate(); renderMenu(); scheduleSave();
      }
    };
    if (k === brush) b.classList.add("active");
    p.appendChild(b);
  });
}

const LIST_GROUPS = [
  { name: "厨师出生点", kinds: ["spawn"] },
  { name: "台面", kinds: ["counter"] },
  { name: "烹饪工位", kinds: ["cooker", "frying", "chopping"] },
  { name: "料箱", kinds: ["dispenser"] },
  { name: "盘子 / 洗涤", kinds: ["plate_stack", "plate_return", "washing"] },
  { name: "出餐口", kinds: ["serving"] },
  { name: "锅具 / 工具", kinds: ["utensil"] },
];
const LIST_GROUP_OTHER = "其他";
function listGroupOf(kind) {
  const g = LIST_GROUPS.find(g => g.kinds.indexOf(kind) >= 0);
  return g ? g.name : LIST_GROUP_OTHER;
}
function renderList() {
  const list = document.getElementById("list");
  const scrollTop = list.scrollTop || 0;
  list.innerHTML = "";
  if (!objs.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "还没有物体。从右侧笔刷选择后点画布放置。";
    list.appendChild(empty);
    return;
  }
  const grouped = {};
  objs.forEach((o, i) => {
    const name = listGroupOf(o.kind);
    (grouped[name] || (grouped[name] = [])).push({ o, i });
  });
  const order = LIST_GROUPS.map(g => g.name).concat([LIST_GROUP_OTHER]);
  order.forEach(name => {
    const items = grouped[name];
    if (!items || !items.length) return;
    items.sort((a, b) => a.o.x - b.o.x || a.o.z - b.o.z);
    const header = document.createElement("div");
    header.className = "group";
    header.textContent = name + "（" + items.length + "）";
    list.appendChild(header);
    items.forEach(({ o, i }) => {
      const d = document.createElement("div");
      d.className = "row" + (i === selected ? " sel" : "");
      const k = KINDS.find(k=>k.prefab===o.prefab) || KINDS.find(k=>k.kind===o.kind) || {color:"#888"};
      d.innerHTML = `<span class="sw" style="background:${k.color}"></span>
        <span class="n">${k.name || o.kind}${o.ing?" · "+o.ing:""}</span>
        <span class="c">${o.x},${o.z}</span>`;
      d.onclick = () => {
        selected = (selected === i ? -1 : i);
        if (selected >= 0 && o.kind === "dispenser") document.getElementById("ingSel").value = o.ing || INGREDIENTS[0].v;
        draw(); renderList();
      };
      d.oncontextmenu = (e) => { e.preventDefault(); removeObjectAt(i); };
      list.appendChild(d);
    });
  });
  list.scrollTop = Math.min(scrollTop, list.scrollHeight || scrollTop);
}

function validate() {
  const bad = [];
  const seen = {};
  objs.forEach(o => {
    if (o.x < FLOOR.x0 || o.x > FLOOR.x1 || o.z < FLOOR.z0 || o.z > FLOOR.z1)
      bad.push(`${kindName(o)} 在 (${o.x},${o.z}) 超出地板范围`);
    // 与生成器一致：utensil / plate_stack 装在宿主格上，不算“同一格放了多个物体”。
    if (o.kind !== "spawn" && solidAt(o)) {
      const k = o.x + "," + o.z;
      if (seen[k]) bad.push(`格 (${k}) 放了多个物体`);
      else seen[k] = 1;
    }
  });
  findOverlaps(objs).forEach(p => bad.push(overlapText(p)));
  const spawnCount = objs.filter(o => o.kind === "spawn").length;
  if (objs.length && spawnCount === 0) bad.push("没有厨师出生点（spawn）：进入关卡可能没有厨师");
  const st = document.getElementById("status");
  if (bad.length) { st.innerHTML = `<span class="err">${bad.length} 个问题：${bad.slice(0,6).join("；")}${bad.length > 6 ? "；…" : ""}</span>`; }
  else { st.innerHTML = `<span class="good">校验通过</span>　共 ${objs.length} 个物体（${spawnCount} 个 spawn）`; }
}

function removeObjectAt(i) {
  if (i < 0 || i >= objs.length) return;
  objs.splice(i, 1);
  if (selected === i) selected = -1;
  else if (selected > i) selected--;
  draw(); renderList(); validate(); renderMenu(); scheduleSave();
}
function deleteSelected() {
  if (selected >= 0) removeObjectAt(selected);
}

// ---- 画布交互：按下即画、拖动连续画、松手结束 ----
let painting = false, hover = null, lastCellKey = "";

function placeAt(c, erase, allowOverlap) {
  if (!c) return;
  const key = c.x + "," + c.z;
  if (key === lastCellKey) return;
  lastCellKey = key;

  if (erase) {
    const bb = layoutBounds(objs);
    let i = -1;
    // 先删家具（后放的在上层）；格子上没有家具时才删 spawn。
    // 这样台面盖住 spawn 时橡皮不会误删 spawn，单独点 spawn 所在格又能删掉它。
    for (let n = objs.length - 1; n >= 0; n--) {
      if (objs[n].kind !== "spawn" && covers(objs[n], c.x, c.z, bb)) { i = n; break; }
    }
    if (i < 0) {
      for (let n = objs.length - 1; n >= 0; n--) {
        if (objs[n].kind === "spawn" && covers(objs[n], c.x, c.z, bb)) { i = n; break; }
      }
    }
    if (i >= 0) removeObjectAt(i);
    return;
  }

  const cand = { kind: brush.kind, prefab: brush.prefab, so: brush.so,
                 ing: brush.kind === "dispenser" ? document.getElementById("ingSel").value : "",
                 x: c.x, z: c.z, note: "" };

  // 不在这里拒绝重叠：单击先放下去，draw() 把它画成红色边框，validate() 在底部校验区
  // 列出「(x,z) 的X与 (x,z) 的Y占地重叠」。生成器仍然会因此失败（这是对的），
  // 但用户能在保存/构建之前就看到问题。
  // 拖动连画（allowOverlap=false）时跳过已占格，否则一条拖拽会堆出一串互相重叠的工位。
  if (!allowOverlap && solidAt(cand) && conflictsWith(cand)) return;

  objs.push(cand);
  selected = -1;   // 放下后不选中：避免 R / Delete 误作用到刚放的物体
  draw(); renderList(); validate(); renderMenu(); scheduleSave();
}

cv.addEventListener("mousedown", (ev) => {
  ev.preventDefault();
  painting = true; lastCellKey = "";
  placeAt(cellAt(ev), document.getElementById("eraseMode").checked || ev.button === 2, true);
});
cv.addEventListener("mousemove", (ev) => {
  const c = cellAt(ev);
  const changed = (!!c !== !!hover) || (c && hover && (c.x !== hover.x || c.z !== hover.z));
  hover = c;
  if (painting) { placeAt(c, document.getElementById("eraseMode").checked, false); }
  else if (changed) { draw(); }
});
window.addEventListener("mouseup", () => { painting = false; lastCellKey = ""; });
cv.addEventListener("mouseleave", () => { hover = null; draw(); });
cv.addEventListener("contextmenu", (e) => e.preventDefault());

// ---- 实时保存（防抖 800ms）----
let saveTimer = null;
function scheduleSave() {
  if (!document.getElementById("autoSave").checked) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => document.getElementById("btnSave").click(), 800);
}

function parseMenuLine(text) {
  const m = text.match(/^#\s*menu:\s*(.+)$/m);
  if (!m) return [];
  return m[1].split(',').map(s => s.trim()).filter(Boolean);
}
function parseTSV(text) {
  const out = [];
  text.split(/\r?\n/).forEach(line => {
    if (!line || line.startsWith("#")) return;
    const f = line.split("\t");
    if (f.length < 6) return;
    if (!/^[a-z_]+$/.test(f[0]) || f[0] === "kind") return;
    const x = parseInt(f[4], 10), z = parseInt(f[5], 10);
    if (!Number.isFinite(x) || !Number.isFinite(z)) return;   // 表头 / 坏行
    // 第 8 列是朝向；空着表示“按位置推导”（生成器也一样）。
    // 只接受 0 <= dir < 360，和生成器 float.TryParse + 范围检查保持一致。
    const rawDir = (f.length >= 8 && f[7] !== "") ? parseInt(f[7], 10) : NaN;
    const dir = (Number.isFinite(rawDir) && rawDir >= 0 && rawDir < 360) ? rawDir : undefined;
    out.push({ kind:f[0], prefab:f[1], so:f[2], ing:f[3], x:x, z:z,
               note:f[6]||"", dir:dir });
  });
  return out;
}

const RECIPES = [
  { n: "Burrito_Chicken_SO",   label: "鸡肉卷",  need: ["TortillaSO","BurritoChickenSO","RiceSO"] },
  { n: "Sushi_PlainFish_SO",   label: "寿司(鱼)", need: ["SushiFishSO","RiceSO"] },
  { n: "Sushi_PlainPrawn_SO",  label: "寿司(虾)", need: ["SushiPrawnSO","RiceSO"] },
  { n: "Burrito_Beef_SO",      label: "牛肉卷",  need: ["TortillaSO","BurritoMeatSO","RiceSO"] },
];
let menuSel = [];
function renderMenu() {
  const box = document.getElementById("menuList");
  box.innerHTML = "";
  RECIPES.forEach(r => {
    const id = "m_" + r.n;
    const on = menuSel.includes(r.n);
    const has = r.need.every(need => objs.some(o => o.kind === "dispenser" && o.ing === need));
    box.innerHTML += `<label style="display:block;margin:2px 0;color:${has ? "#e8eaed" : "#8b929b"}">
      <input type="checkbox" id="${id}" ${on ? "checked" : ""}> ${r.label} <span style="font-size:11px">(${r.n.replace("_SO","")}${has ? "" : " · 缺原料"})</span></label>`;
  });
  RECIPES.forEach(r => {
    const el = document.getElementById("m_" + r.n);
    if (el) el.onchange = () => {
      if (el.checked) { if (!menuSel.includes(r.n)) menuSel.push(r.n); }
      else menuSel = menuSel.filter(x => x !== r.n);
    };
  });
}
document.getElementById("btnMenuAuto").onclick = () => {
  menuSel = RECIPES.filter(r => r.need.every(need => objs.some(o => o.kind === "dispenser" && o.ing === need))).map(r => r.n);
  renderMenu();
};
document.getElementById("btnMenuAll").onclick = () => { menuSel = RECIPES.map(r => r.n); renderMenu(); };
function toTSV() {
  const lines = [];
  lines.push("# wellcooked_demo layout (unit: 1 m grid; x right, z up)");
  lines.push("# columns: kind\tprefab\tso\tingredient\tx\tz\tnote");
  lines.push("kind\tprefab\tso\tingredient\tx\tz\tnote");
  if (menuSel.length) lines.push("# menu: " + menuSel.join(", "));
  objs.slice().sort((a,b)=> a.z-b.z || a.x-b.x).forEach(o => {
    lines.push([o.kind, o.prefab, o.so, o.ing, o.x, o.z, o.note||"", (o.dir===undefined?"":o.dir)].join("\t"));
  });
  return lines.join("\n") + "\n";
}

// ---- 处理时间：写 BepInEx\wellcooked-processing.json，插件读同一份文件 ----
// 范围由服务端 /api/processing 统一下发；插件 ProcessingTuner.cs 用同一组常量兜底。
const PROC_DEFAULTS = { cook_time: 10, chop_stages: 8, chop_multiplier: 5 };
let procRanges = { cook_time: [1, 30, 0.5], chop_stages: [2, 8, 1], chop_multiplier: [1, 10, 1] };
let procPath = "";
function procEl(id) { return document.getElementById(id); }
function updateCookHint() {
  const v = parseFloat(procEl("cookTime").value);
  const t = Number.isFinite(v) ? Math.max(1, Math.min(30, v)) : PROC_DEFAULTS.cook_time;
  procEl("cookHint").textContent = "煮好 " + t + "s，烧焦 " + (t * 2) + "s（游戏规则 2×）";
  updateChopEstimate();
}
// 游戏数据：AnimationEventData 的 Chop 是 duration=0.2s、Impact=0.2s，
// 所以一次下刀 ≈ 0.2s。完成条件是 m_progress == stages-1，每阶段需要 M 刀：
//   总刀数 = (stages-1) * M；时间 ≈ 总刀数 * 0.2s。
// 2P+ 时游戏把每阶段刀数固定为 1（SingleplayerChopTimeMultiplier 不参与）。
const CHOP_SECONDS = 0.2;
function updateChopEstimate() {
  const s = Math.max(2, Math.min(8, parseInt(procEl("chopStages").value, 10) || 8));
  const m = Math.max(1, Math.min(10, parseInt(procEl("chopMult").value, 10) || 5));
  const single = (s - 1) * m;
  const multi = (s - 1) * 1;
  const sec = (n) => (n * CHOP_SECONDS).toFixed(1);
  procEl("chopEstimate").textContent =
    "单人：" + single + " 刀 ≈ " + sec(single) + "s；2P+：" + multi + " 刀 ≈ " + sec(multi) + "s（0.2s/刀）";
}
function setProcessingInputs(values, ranges) {
  if (ranges) procRanges = ranges;
  const map = [["cookTime", "cook_time"], ["chopStages", "chop_stages"], ["chopMult", "chop_multiplier"]];
  map.forEach(([id, key]) => {
    const el = procEl(id); if (!el) return;
    const r = procRanges[key] || [PROC_DEFAULTS[key], PROC_DEFAULTS[key], 1];
    el.min = r[0]; el.max = r[1]; el.step = r.length > 2 ? r[2] : 1;
    el.value = (values && values[key] !== undefined) ? values[key] : PROC_DEFAULTS[key];
  });
  updateCookHint();
}
function procStatus(text, ok) {
  const st = procEl("procStatus");
  st.textContent = text + (procPath ? ("\n" + procPath) : "");
  st.style.color = ok ? "#3ecf8e" : "#ff6b6b";
  st.title = procPath;
}
async function loadProcessing() {
  try {
    const r = await fetch("/api/processing");
    const j = await r.json();
    if (!j || !j.ok || !j.values) throw new Error((j && j.error) || "接口不可用");
    procPath = j.path || "";
    setProcessingInputs(j.values, j.ranges);
    procStatus(j.updated_at ? ("已写入 " + j.updated_at + "；重进关卡生效")
                            : "尚未写入；当前显示默认值（10s / 8 阶段 / 5 刀）", true);
  } catch (e) {
    setProcessingInputs(PROC_DEFAULTS, procRanges);
    procStatus("处理时间接口不可用：" + e.message, false);
  }
}
async function applyProcessing(values) {
  const v = values || {
    cook_time: parseFloat(procEl("cookTime").value),
    chop_stages: parseInt(procEl("chopStages").value, 10),
    chop_multiplier: parseInt(procEl("chopMult").value, 10),
  };
  try {
    const r = await fetch("/api/processing", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(v)
    });
    const j = await r.json();
    if (!j || !j.ok) throw new Error((j && j.error) || "写入失败");
    procPath = j.path || procPath;
    setProcessingInputs(j.values, j.ranges);
    procStatus("已写入 " + j.values.cook_time + "s / " + j.values.chop_stages + " 阶段 / "
               + j.values.chop_multiplier + " 刀；重进关卡生效", true);
  } catch (e) {
    procStatus("写入失败：" + e.message, false);
  }
}
document.getElementById("btnApplyProcessing").onclick = () => applyProcessing();
document.getElementById("btnResetProcessing").onclick = () => applyProcessing(PROC_DEFAULTS);
["cookTime", "chopStages", "chopMult"].forEach(id => {
  const el = procEl(id); if (el) el.addEventListener("input", updateCookHint);
});

async function refreshFiles() {
  const r = await fetch("/api/list"); const j = await r.json();
  const sel = document.getElementById("fileSel");
  sel.innerHTML = "";
  (j.files||[]).forEach(f => { const o=document.createElement("option"); o.value=f; o.textContent=f; sel.appendChild(o); });
}

async function loadFile(name) {
  const r = await fetch("/api/load?name=" + encodeURIComponent(name));
  const j = await r.json();
  if (!j.ok) { document.getElementById("status").innerHTML = `<span class="err">${j.error}</span>`; return; }
  objs = parseTSV(j.content);
  selected = -1;
  menuSel = parseMenuLine(j.content);
  renderMenu();
  document.getElementById("fileName").value = name;
  draw(); renderList(); validate(); renderMenu();
}

document.getElementById("btnRotate").onclick = () => rotateSelected();
window.addEventListener("keydown", (e) => { if (e.key === "r" || e.key === "R") rotateSelected(); if (e.key === "Delete") { e.preventDefault(); deleteSelected(); } if (e.key === "Escape") { selected = -1; draw(); renderList(); } });
function rotateSelected() {
  if (selected < 0 || !objs[selected]) { return; }
  const o = objs[selected];
  const st = document.getElementById("status");
  if (o.kind === "serving") {
    // 箭头必须朝屋外，朝向由位置决定（生成器 ServingYaw，东 90 / 北 0 / 南 180 / 西 270）。
    st.innerHTML = '<span class="err">出餐口的箭头必须朝屋外，朝向由位置决定，不能旋转</span>';
    return;
  }
  // 从“当前生效朝向”转 90°：墙边没写 dir 的工位也能正确转。
  const cur = yawOf(o, layoutBounds(objs));
  o.dir = (cur + 90) % 360;
  draw(); renderList(); validate(); renderMenu(); scheduleSave();
}
document.getElementById("btnLoad").onclick = () => loadFile(document.getElementById("fileSel").value);
document.getElementById("btnClear").onclick = () => { if (confirm("清空当前编辑内容？")) { objs=[]; selected=-1; draw(); renderList(); validate(); } };
document.getElementById("btnBuild").onclick = async () => {
  const st = document.getElementById("status");
  st.innerHTML = "正在保存并构建（约 6-10 分钟）…";
  await document.getElementById("btnSave").click();
  try {
    const r = await fetch("/api/build", {method:"POST"});
    const j = await r.json().catch(() => ({}));
    if (!j || !j.ok) {
      st.innerHTML = '<span class="err">构建请求失败：' + ((j && j.error) || "未配置构建脚本") + '</span>';
      return;
    }
  } catch(e) { st.innerHTML = "构建请求失败"; return; }
  const timer = setInterval(async () => {
    try {
      const r = await fetch("/api/build/status"); const j = await r.json();
      st.innerHTML = "<span class=\"good\">" + (j.building ? "构建中…" : "构建结束") + "</span><br><pre style=\"font-size:11px;white-space:pre-wrap\">" + (j.log || "") + "</pre>";
      if (!j.building) clearInterval(timer);
    } catch(e) {}
  }, 3000);
};

document.getElementById("btnSave").onclick = async () => {
  const name = document.getElementById("fileName").value.trim();
  const r = await fetch("/api/save", {
    method:"POST", headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ name, content: toTSV() })
  });
  const j = await r.json();
  document.getElementById("status").innerHTML = j.ok
    ? `<span class="good">已保存 ${j.name}（${j.bytes} 字节，原文件备份为 .bak）</span>`
    : `<span class="err">保存失败：${j.error}</span>`;
  refreshFiles();
};

(function init(){
  const ing = document.getElementById("ingSel");
  INGREDIENTS.forEach(i => { const o=document.createElement("option"); o.value=i.v; o.textContent=i.n + "  (" + i.v + ")"; ing.appendChild(o); });
  ing.addEventListener("change", () => {
    if (selected >= 0 && objs[selected] && objs[selected].kind === "dispenser") {
      objs[selected].ing = ing.value;
      draw(); renderList(); validate(); renderMenu(); scheduleSave();
    }
  });
  const origRenderPalette = renderPalette;
  renderPalette = function() {
    origRenderPalette();
  };
  renderPalette(); draw(); validate(); refreshFiles(); loadProcessing();
})();
</script>
